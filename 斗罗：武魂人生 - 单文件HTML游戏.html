<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>斗罗：武魂人生</title>
<style>
:root{
  --bg:#0d0a14;--bg2:#171225;--panel:#1e1830;--panel2:#282040;--gold:#d4af37;
  --gold2:#f4d77a;--text:#e8e2d0;--muted:#9a8fb8;--rare:#6ec1ff;--epic:#c77dff;
  --legend:#ffb347;--hidden:#ff4d6d;--ok:#7ee787;--bad:#ff6b6b;--border:#3a2f55;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(circle at 50% 0%,#241a3d 0%,#0d0a14 70%);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto;position:relative}
.screen{flex:1;overflow-y:auto;padding:14px;display:none;animation:fade .3s}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3{font-weight:700;letter-spacing:1px}
.title{text-align:center;color:var(--gold2);text-shadow:0 0 18px rgba(212,175,55,.5);margin:10px 0}
.btn{background:linear-gradient(180deg,#3a2f55,#241c3a);border:1px solid var(--gold);color:var(--gold2);
  padding:10px 16px;border-radius:8px;cursor:pointer;font-size:15px;transition:all .15s;display:inline-block;text-align:center}
.btn:hover{background:linear-gradient(180deg,#4a3d6e,#2e2447);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.primary{background:linear-gradient(180deg,#b8902e,#7a5f1a);color:#fff;border-color:var(--gold2)}
.btn.danger{border-color:var(--bad);color:#ffb3b3}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:6px}
.grid{display:grid;gap:8px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:600px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;border:1px solid}
.tag.common{color:#bbb;border-color:#666}
.tag.rare{color:var(--rare);border-color:var(--rare)}
.tag.epic{color:var(--epic);border-color:var(--epic)}
.tag.legend{color:var(--legend);border-color:var(--legend)}
.tag.hidden{color:var(--hidden);border-color:var(--hidden)}
.stat{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;border-bottom:1px dashed #2a2240}
.stat b{color:var(--gold2)}
.bar{height:8px;background:#000;border-radius:4px;overflow:hidden;margin-top:2px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .3s}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border);font-size:13px;flex-wrap:wrap;gap:6px}
.topbar .gold{color:var(--gold2)}
.nav{display:flex;gap:4px;padding:6px;background:var(--panel);border-top:1px solid var(--border);flex-wrap:wrap;justify-content:center}
.nav .btn{padding:6px 10px;font-size:12px;flex:1;min-width:60px}
/* 抽卡 */
.gacha-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:20px}
.card-flip{width:200px;height:280px;perspective:1000px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .8s;transform-style:preserve-3d}
.card-flip.flipped .card-inner{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;border:2px solid var(--gold)}
.card-back{background:linear-gradient(135deg,#2a1f4a,#0d0a14);background-image:repeating-linear-gradient(45deg,rgba(212,175,55,.08) 0 10px,transparent 10px 20px)}
.card-back::before{content:"武魂";font-size:40px;color:var(--gold);text-shadow:0 0 20px var(--gold)}
.card-front{background:linear-gradient(160deg,#2a1f4a,#120c1f);transform:rotateY(180deg)}
.card-front h3{color:var(--gold2);margin-bottom:8px}
.card-front .rarity{font-size:12px;margin-bottom:10px}
.card-front p{font-size:12px;color:var(--muted);line-height:1.5}
.typein{opacity:0;animation:typein .4s forwards}
@keyframes typein{to{opacity:1}}
/* 轮盘 */
.roulette-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
#rouletteCanvas{max-width:340px;width:100%}
.pointer{width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid var(--gold2);margin-bottom:-10px;z-index:2;filter:drop-shadow(0 2px 4px #000)}
/* 战斗 */
.battle-field{display:flex;justify-content:space-between;align-items:center;min-height:240px;padding:10px;background:linear-gradient(180deg,#1a1330,#0d0a14);border-radius:10px;margin-bottom:10px;position:relative;overflow:hidden}
.combatant{text-align:center;flex:1;position:relative}
.combatant .sprite{font-size:48px;display:inline-block;transition:transform .3s}
.combatant.attack .sprite{animation:atk .4s}
.combatant.hurt .sprite{animation:hurt .4s}
@keyframes atk{50%{transform:translateX(30px) scale(1.1)}}
@keyframes hurt{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px);filter:brightness(2) hue-rotate(-30deg)}75%{transform:translateX(8px)}}
.hpbar{height:10px;background:#000;border-radius:5px;overflow:hidden;margin:4px auto;width:80%}
.hpbar>div{height:100%;background:linear-gradient(90deg,#ff4d4d,#ff9a4d);transition:width .4s}
.log{background:#000;border-radius:8px;padding:8px;height:110px;overflow-y:auto;font-size:13px;line-height:1.6;margin-bottom:8px}
.log div{opacity:0;animation:fade .3s forwards}
/* 粒子 */
.particle{position:fixed;pointer-events:none;width:6px;height:6px;border-radius:50%;background:var(--gold2);z-index:99}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal-box{background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:18px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto}
.event-text{font-size:15px;line-height:1.8;margin-bottom:14px;color:#f0e8d0}
.option{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;margin-bottom:8px;cursor:pointer;font-size:14px;transition:all .15s}
.option:hover{border-color:var(--gold);background:#32284f}
.option:disabled{opacity:.4;cursor:not-allowed}
.toast{position:fixed;top:20%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.9);border:1px solid var(--gold);color:var(--gold2);padding:10px 18px;border-radius:8px;z-index:100;animation:fade .3s}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
select,input{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:6px;font-size:13px}
</style>
</head>

function RNG(seed){let s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
let rng=RNG(Date.now());
const ri=(a,b)=>Math.floor(rng()*(b-a+1))+a;
const pick=arr=>arr[Math.floor(rng()*arr.length)];
const chance=p=>rng()<p;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function weightedPick(list,weightFn){const total=list.reduce((s,x)=>s+weightFn(x),0);let r=rng()*total;for(const x of list){r-=weightFn(x);if(r<=0)return x;}return list[list.length-1];}

/* ============ 伙伴生成 ============ */
function genPartner(speciesId,level=1){
 const sp=SPECIES.find(s=>s.id===speciesId)||SPECIES[0];
 const iv={hp:ri(0,31),atk:ri(0,31),def:ri(0,31),spd:ri(0,31),soul:ri(0,31)};
 const natures=["勤奋","固执","开朗","胆小","保守","稳重","害羞","勇敢","冷静","调皮"];
 const nature=pick(natures);
 const stats={};
 for(const k in sp.base){stats[k]=Math.floor((sp.base[k]*2+iv[k])*level/100+5);}
 const skills=sp.skills.slice(0,Math.min(4,Math.ceil(level/5)+1));
 const p={
  id:Math.random().toString(36).slice(2),
  species:sp.id,name:sp.name,nature,level,exp:0,
  iv,stats,maxHp:stats.hp,hp:stats.hp,
  intimacy:50,skills,rings:[],bones:{},
  trait:sp.trait?sp.trait[0]:null,
  evolved:false
 };
 if(!S.codex.partners.includes(sp.id)){S.codex.partners.push(sp.id);}
 return p;
}
function partnerSpecies(p){return SPECIES.find(s=>s.id===p.species)||EVOLUTIONS[p.species]||{name:p.name,types:["强攻"],base:p.stats};}
function calcStats(p){
 const sp=partnerSpecies(p);
 const base=sp.base;
 for(const k in base){p.stats[k]=Math.floor((base[k]*2+p.iv[k])*p.level/100+5);}
 p.maxHp=p.stats.hp;p.hp=Math.min(p.hp,p.maxHp);
}
function gainExp(p,amt){
 p.exp+=amt;
 while(p.exp>=p.level*20){
  p.exp-=p.level*20;p.level++;calcStats(p);p.hp=p.maxHp;
  const sp=partnerSpecies(p);
  if(sp.evolve&&p.level>=sp.evolve.level&&!p.evolved){
   if(!sp.evolve.item||S.items[sp.evolve.item]){
    if(sp.evolve.item)S.items[sp.evolve.item]--;
    p.species=sp.evolve.to;p.evolved=true;calcStats(p);
    logEvent(p.name+"进化为了"+EVOLUTIONS[sp.evolve.to].name+"！");
   }
  }
  if(p.level%10===0&&p.rings.length<9){
   const year=RING_YEARS[Math.min(p.rings.length,4)];
   p.rings.push(year.name);
   const newSkill=(SPECIES.find(s=>s.id===p.species)||{skills:[]}).skills;
   if(newSkill&&newSkill[p.rings.length])p.skills.push(newSkill[p.rings.length]);
   if(p.skills.length>4)p.skills=p.skills.slice(-4);
   logEvent(p.name+"吸收了"+year.name+"魂环！");
  }
 }
}

/* ============ 事件处理 ============ */
function logEvent(text){S.eventLog.unshift({text,time:`第${S.year}年${S.month}月`});if(S.eventLog.length>50)S.eventLog.pop();}
function toast(text){const t=document.createElement("div");t.className="toast";t.textContent=text;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}

function applyResult(r,ev){
 if(!r)return;
 if(r.soulExp){S.soulExp+=r.soulExp;checkLevelUp();}
 if(r.comprehension)S.comprehension+=r.comprehension;
 if(r.physique)S.physique+=r.physique;
 if(r.luck)S.luck+=r.luck;
 if(r.charm)S.charm+=r.charm;
 if(r.family)S.family+=r.family;
 if(r.gold)S.wealth+=r.gold;
 if(r.reputation)S.reputation+=r.reputation;
 if(r.morality)S.morality=clamp(S.morality+r.morality,0,100);
 if(r.hp){S.hp=clamp(S.hp+r.hp,0,S.maxHp);}
 if(r.mood)S.mood=clamp(S.mood+r.mood,0,100);
 if(r.fatigue)S.fatigue=clamp(S.fatigue+r.fatigue,0,100);
 if(r.lifespan)S.lifespan+=r.lifespan;
 if(r.flag&&!S.flags.includes(r.flag))S.flags.push(r.flag);
 if(r.item){if(r.item==="随机"){const keys=Object.keys(ITEMS).filter(k=>ITEMS[k].price>0);S.items[pick(keys)]=(S.items[pick(keys)]||0)+1;}else{S.items[r.item]=(S.items[r.item]||0)+1;}}
 if(r.location&&r.location!=="random")S.location=r.location;
 if(r.location==="random"){const locs=Object.keys(LOCATIONS);S.location=pick(locs);}
 if(r.rep){for(const k in r.rep){if(k==="random"){const ks=Object.keys(S.reputation);S.reputation[pick(ks)]+=r.rep[k];}else S.reputation[k]=(S.reputation[k]||0)+r.rep[k];}}
 if(r.npc)addNPC(r.npc);
 if(r.companion){
  let sp;
  if(r.companion==="random"||r.companion==="random_weak"||r.companion==="weak"){
   const enc=LOCATIONS[S.location].enc||["bluegrass"];sp=pick(enc);
  }else if(r.companion==="egg"){sp=pick(["bluegrass","softrabbit","shadowwolf"]);}
  else if(r.companion==="rare"){sp=pick(["firephoenix","golddragon","lightunicorn","titangorilla"]);}
  else if(r.companion==="divine"){sp=pick(["golddragon","firephoenix","lightunicorn"]);}
  else if(r.companion==="chance"){if(chance(.5))sp=pick(LOCATIONS[S.location].enc||["bluegrass"]);}
  if(sp&&S.partners.length<6){const p=genPartner(sp,ri(1,5));S.partners.push(p);logEvent("获得了伙伴："+p.name);toast("获得伙伴："+p.name);}
 }
 if(r.child){const child={name:"孩子"+(S.children.length+1),age:0,inherited:false};S.children.push(child);logEvent("你的孩子出生了！");}
 if(r.awaken){awakenSoul();}
 if(r.battle){startBattle(r.battle);}
 if(r.catch){tryCatch(r.catch);}
 if(r.luck_check&&!chance(S.luck/100)){toast("运气不佳...");}
 if(r.charm_check&&!chance(S.charm/150)){toast("魅力不足...");}
 if(r.skill){toast("学会了新魂技！");}
 if(r.codex){toast("图鉴已记录！");}
 save();
}

function checkLevelUp(){
 const need=S.soulLevel*50;
 if(S.soulExp>=need){S.soulExp-=need;S.soulLevel++;S.maxHp+=10;S.hp=S.maxHp;toast("魂力等级提升！当前："+soulRank(S.soulLevel));checkLevelUp();}
}
function soulRank(lv){
 const ranks=["魂士","魂师","大魂师","魂尊","魂宗","魂王","魂帝","魂圣","魂斗罗","封号斗罗"];
 return ranks[Math.min(Math.floor(lv/10),9)]+"("+lv+"级)";
}

function awakenSoul(){

  const sp2=pick(SPECIES.filter(s=>s.id!==sp.id));
  S.partners.push(genPartner(sp2.id,1));

 }
 if(S.flags.includes("companion_beast")||S.traits.find(t=>t.id==="companion_beast")){
  const sp3=pick(["softrabbit","shadowwolf","ghostcat"]);
  S.partners.push(genPartner(sp3.id,1));

}

/* ============ 命运轮盘 ============ */
function getRouletteEvents(){
 const pool=EVENTS.filter(e=>{
  if(e.flagReq&&!S.flags.includes(e.flagReq))return false;
  if(e.ageReq&&S.age<e.ageReq)return false;
  return true;
 });
 return pool;
}
function spinRoulette(){
 if(S.rouletteUsed){toast("本月已转动过轮盘");return;}
 S.rouletteUsed=true;
 const pool=getRouletteEvents();
 const ev=weightedPick(pool,e=>e.weight*(S.luck>70&&e.type.includes("隐藏")?2:1));
 triggerEvent(ev);
}

function triggerEvent(ev){
 S.battle=null;
 const box=document.createElement("div");
 box.className="modal";
 box.innerHTML=`<div class="modal-box">
  <div class="tag ${ev.type.includes('主线')?'legend':'common'}" style="margin-bottom:8px">${ev.type}</div>
  <div class="event-text">${ev.text}</div>
  <div id="eventOpts"></div>
 </div>`;
 document.getElementById("modalRoot").appendChild(box);
 const optsDiv=box.querySelector("#eventOpts");
 ev.opts.forEach((opt,i)=>{
  const b=document.createElement("button");
  b.className="option";b.textContent=opt.text;
  b.onclick=()=>{applyResult(opt.result,ev);box.remove();if(!S.battle)render();};
  optsDiv.appendChild(b);
 });
}

/* ============ 战斗系统 ============ */
function startBattle(type){
 let enemies=[];
 const loc=LOCATIONS[S.location];
 const enc=loc.enc&&loc.enc.length?loc.enc:["bluegrass"];
 if(type==="random"||type==="weak"){const lv=Math.max(1,S.soulLevel-2+ri(-2,3));enemies=[genPartner(pick(enc),lv)];}
 else if(type==="group"){for(let i=0;i<ri(2,3);i++)enemies.push(genPartner(pick(enc),Math.max(1,S.soulLevel-3)));}
 else if(type==="rare"){enemies=[genPartner(pick(["firephoenix","golddragon","lightunicorn","facespider"]),S.soulLevel+ri(0,5))];}
 else if(type==="boss"||type==="revenge_boss"||type==="revenge_final"){enemies=[genPartner(pick(["titangorilla","golddragon","facespider"]),S.soulLevel+ri(3,8))];}
 else if(type==="bandit"||type==="gang"||type==="duel"){enemies=[genPartner(pick(["shadowwolf","ghostcat","whitetiger"]),Math.max(1,S.soulLevel+ri(-1,3)))];}
 else if(type==="war"||type==="final_war"){for(let i=0;i<3;i++)enemies.push(genPartner(pick(["whitetiger","ghostcat","thundereagle"]),S.soulLevel+ri(0,4)));}
 else if(type==="escort"){enemies=[genPartner("shadowwolf",Math.max(1,S.soulLevel-1))];}
 else if(type==="divine"||type==="god_trial"){enemies=[genPartner(pick(["golddragon","firephoenix"]),S.soulLevel+10)];}
 else enemies=[genPartner(pick(enc),Math.max(1,S.soulLevel))];
 if(!S.partners.length){S.partners.push(genPartner("bluegrass",1));}
 S.partners.forEach(p=>p.hp=p.maxHp);
 S.battle={enemies,turn:0,playerIdx:S.activePartner,enemyIdx:0,log:[],phase:"action",wild:type==="random"||type==="rare"||type==="weak"};
 render();
}

function battleAction(skillName){
 const b=S.battle;if(!b||b.phase!=="action")return;
 const player=S.partners[b.playerIdx];
 const enemy=b.enemies[b.enemyIdx];
 if(!player||player.hp<=0){toast("该伙伴已倒下");return;}
 const skill=SKILLS[skillName]||SKILLS["普通攻击"];
 // 玩家攻击
 const dmg=calcDamage(player,enemy,skill);
 enemy.hp=Math.max(0,enemy.hp-dmg);
 b.log.push(`${player.name}使用了${skillName}，造成${dmg}点伤害！`);
 if(skill.effect&&skill.effect.status&&chance(skill.effect.chance||.3)){
  enemy.status=skill.effect.status;b.log.push(`${enemy.name}陷入了${skill.effect.status}状态！`);
 }
 if(skill.effect&&skill.effect.drain){player.hp=Math.min(player.maxHp,player.hp+Math.floor(dmg*skill.effect.drain));}
 if(enemy.hp<=0){b.log.push(`${enemy.name}被击败了！`);b.enemyIdx++;if(b.enemyIdx>=b.enemies.length){battleEnd(true);return;}b.phase="action";render();return;}
 // 敌人攻击
 setTimeout(()=>{
  if(enemy.status==="眩晕"||enemy.status==="冰冻"||enemy.status==="石化"){b.log.push(`${enemy.name}无法行动！`);enemy.status=null;}
  else{
   const esk=pick(SKILLS[enemy.skills[0]]?enemy.skills:["普通攻击"]);
   const edmg=calcDamage(enemy,player,SKILLS[esk]||SKILLS["普通攻击"]);
   player.hp=Math.max(0,player.hp-edmg);
   b.log.push(`${enemy.name}使用了${esk}，造成${edmg}点伤害！`);
   if(player.hp<=0){b.log.push(`${player.name}倒下了！`);const next=S.partners.findIndex(p=>p.hp>0);if(next>=0){b.playerIdx=next;}else{battleEnd(false);return;}}
  }
  b.turn++;render();
 },500);
}

function calcDamage(attacker,defender,skill){
 const sp=partnerSpecies(attacker);
 const dsp=partnerSpecies(defender);
 let atk=attacker.stats.atk,def=defender.stats.def;
 let mult=1;
 for(const t of sp.types)for(const dt of dsp.types)mult*=typeMult(t,dt);
 const base=((attacker.level*2/5+2)*skill.power*atk/def)/50+2;
 let dmg=Math.floor(base*mult*ri(85,100)/100);
 if(mult>1)S.battle.log.push("效果拔群！");
 if(mult<1)S.battle.log.push("效果不佳...");
 return Math.max(1,dmg);
}

function battleSwitch(idx){
 const b=S.battle;if(!b)return;
 if(S.partners[idx]&&S.partners[idx].hp>0){b.playerIdx=idx;b.log.push(`换上了${S.partners[idx].name}！`);
  const enemy=b.enemies[b.enemyIdx];const esk=pick(enemy.skills);const edmg=calcDamage(enemy,S.partners[idx],SKILLS[esk]||SKILLS["普通攻击"]);
  S.partners[idx].hp=Math.max(0,S.partners[idx].hp-edmg);b.log.push(`${enemy.name}趁机攻击，造成${edmg}点伤害！`);
  if(S.partners[idx].hp<=0){b.log.push(`${S.partners[idx].name}倒下了！`);const next=S.partners.findIndex(p=>p.hp>0);if(next>=0)b.playerIdx=next;else{battleEnd(false);return;}}
  render();
 }
}
function battleFlee(){if(chance(.6+S.luck/200)){S.battle=null;logEvent("你成功逃离了战斗。");render();}else{toast("逃跑失败！");const b=S.battle;const enemy=b.enemies[b.enemyIdx];const p=S.partners[b.playerIdx];const edmg=calcDamage(enemy,p,SKILLS["普通攻击"]);p.hp=Math.max(0,p.hp-edmg);b.log.push("逃跑失败，受到攻击！");if(p.hp<=0){const next=S.partners.findIndex(pp=>pp.hp>0);if(next>=0)b.playerIdx=next;else{battleEnd(false);return;}}render();}}
function battleCatch(){
 const b=S.battle;if(!b||!b.wild){toast("无法捕捉");return;}
 const balls=Object.keys(S.items).filter(k=>ITEMS[k]&&ITEMS[k].type==="ball"&&S.items[k]>0);
 if(!balls.length){toast("没有契约器了！");return;}
 const ball=balls[0];S.items[ball]--;
 const enemy=b.enemies[b.enemyIdx];
 const hpRate=enemy.hp/enemy.maxHp;
 const sp=SPECIES.find(s=>s.id===enemy.species)||{catch:30};
 let rate=(1-hpRate)*0.5+0.1;rate*=ITEMS[ball].catch;rate*=(100-sp.catch)/100+0.3;
 if(enemy.status)rate*=1.5;
 if(chance(rate)){
  S.partners.push(enemy);logEvent("成功收服了"+enemy.name+"！");toast("收服成功："+enemy.name);
  b.enemies.splice(b.enemyIdx,1);
  if(b.enemyIdx>=b.enemies.length){battleEnd(true);return;}
  render();
 }else{b.log.push("收服失败！");if(chance(.3)){b.log.push(enemy.name+"逃跑了！");b.enemies.splice(b.enemyIdx,1);if(b.enemyIdx>=b.enemies.length){battleEnd(true);return;}}render();}
}
function battleEnd(win){
 const b=S.battle;
 if(win){
  const totalExp=b.enemies.reduce((s,e)=>s+e.level*10,0);
  S.partners.forEach(p=>{if(p.hp>0)gainExp(p,Math.floor(totalExp/S.partners.filter(pp=>pp.hp>0).length));});
  S.soulExp+=totalExp;checkLevelUp();
  S.reputation+=5;S.mood=clamp(S.mood+5,0,100);
  if(chance(.3)){const loot=pick(["草药","干粮","普通契约器"]);S.items[loot]=(S.items[loot]||0)+1;logEvent("获得战利品："+loot);}
  logEvent("战斗胜利！");
 }else{
  S.hp=Math.max(1,S.hp-20);S.mood=clamp(S.mood-15,0,100);S.fatigue=clamp(S.fatigue+20,0,100);
  logEvent("战斗失败，你受了伤。");
  if(S.hp<=0){checkDeath();}
 }
 S.battle=null;save();render();
}

function checkDeath(){

  if(!S.codex.endings.includes(ending.id))S.codex.endings.push(ending.id);

function continueAsChild(){

/* ============ 每月行动 ============ */
function doAction(action){
 if(S.actionPoints<=0){toast("行动点不足，请推进时间");return;}
 S.actionPoints--;
 if(action==="cultivate"){S.soulExp+=10+Math.floor(S.comprehension/10);S.fatigue+=15;checkLevelUp();logEvent("你潜心修炼，魂力有所增长。");}
 else if(action==="explore"){S.fatigue+=10;if(chance(.5)){const enc=LOCATIONS[S.location].enc;if(enc&&enc.length){const p=genPartner(pick(enc),ri(1,Math.max(1,S.soulLevel)));startBattle("random");return;}}toast("什么也没发现...");}
 else if(action==="social"){S.mood+=10;S.fatigue+=5;if(chance(.4))addNPC("friend");logEvent("你外出社交，心情愉悦。");}
 else if(action==="work"){S.wealth+=30+Math.floor(S.reputation/5);S.fatigue+=20;S.mood-=5;logEvent("你工作赚取了一些金魂币。");}
 else if(action==="rest"){S.hp=Math.min(S.maxHp,S.hp+30);S.mood+=10;S.fatigue=Math.max(0,S.fatigue-30);logEvent("你休息了一番，恢复了精力。");}
 else if(action==="shop"){openShop();return;}
 save();render();
}
function advanceMonth(){
 S.month++;if(S.month>12){S.month=1;S.year++;S.age++;}
 S.actionPoints=3;S.rouletteUsed=false;
 S.fatigue=Math.max(0,S.fatigue-10);
 S.hp=Math.min(S.maxHp,S.hp+5);
 if(S.fatigue>80){S.hp-=10;S.mood-=10;logEvent("过度疲劳，健康受损。");}
 if(S.mood<20){S.comprehension=Math.max(1,S.comprehension-1);}
 // 子女成长
 S.children.forEach(c=>{c.age++;if(c.age===6&&!c.inherited){c.inherited=true;logEvent(c.name+"六岁了，可以开始修炼。");}});
 checkDeath();
 save();render();
}

let gachaState=null;
function startGacha(){
 gachaState={step:0,origin:null,traits:[],revealed:false};
 S=newState((Date.now()&0xffffffff));
 S.codex=loadCodex();
 S.screen="gacha";render();
}
function gacha(div){
 div.innerHTML=`<div class="gacha-stage">
  <h2 class="title">武魂觉醒·抽卡</h2>
  <div id="gachaCards" class="row" style="justify-content:center"></div>
  <div id="gachaInfo"></div>
  <div class="row" style="justify-content:center;margin-top:16px">
   <button id="gachaBtn" class="btn primary" onclick="gachaDraw()">抽取出身</button>
  </div>
 </div>`;
}
function gachaDraw(){
 if(gachaState.step===0){
  const origin=weightedPick(ORIGINS,o=>RARITY[o.rarity].weight);
  gachaState.origin=origin;gachaState.step=1;
  if(!S.codex.origins.includes(origin.id))S.codex.origins.push(origin.id);
  const cards=document.getElementById("gachaCards");
  cards.innerHTML=`<div class="card-flip flipped" onclick="this.classList.toggle('flipped')">
   <div class="card-inner"><div class="card-face card-back"></div>
   <div class="card-face card-front">
    <div class="rarity tag ${origin.rarity}">${RARITY[origin.rarity].name}</div>
    <h3>${origin.name}</h3><p>${origin.desc}</p>
   </div></div></div>`;
  document.getElementById("gachaBtn").textContent="抽取词条";
  document.getElementById("gachaInfo").innerHTML=`<p style="color:var(--gold2)">核心出身：${origin.name}</p>`;
 }else if(gachaState.step<5){
  const available=TRAITS.filter(t=>!gachaState.traits.find(gt=>gt.id===t.id));
  const trait=pick(available);
  gachaState.traits.push(trait);
  if(!S.codex.traits.includes(trait.id))S.codex.traits.push(trait.id);
  const cards=document.getElementById("gachaCards");
  const card=document.createElement("div");
  card.className="card-flip flipped";card.style.width="140px";card.style.height="200px";
  card.innerHTML=`<div class="card-inner"><div class="card-face card-back"></div>
   <div class="card-face card-front" style="border-color:${RARITY[trait.type==='特殊'?'legend':'rare'].color}">
    <div class="rarity tag ${trait.type==='特殊'?'legend':'rare'}">${trait.type}</div>
    <h3 style="font-size:16px">${trait.name}</h3><p style="font-size:11px">${trait.desc}</p>
   </div></div>`;
  cards.appendChild(card);
  gachaState.step++;
  if(gachaState.step>=5){
   document.getElementById("gachaBtn").textContent="确认开始人生";
   document.getElementById("gachaBtn").onclick=confirmGacha;
  }
 }
}
function confirmGacha(){
 const o=gachaState.origin;
 S.origin=o.id;S.traits=gachaState.traits;
 S.name=o.name;
 // 应用出身属性
 for(const k in o.stats)S[k]=o.stats[k];
 S.location=o.location||"village";
 if(o.resources){S.wealth=o.resources.gold||S.wealth;if(o.resources.item)S.items[o.resources.item]=(S.items[o.resources.item]||0)+1;}
 if(o.relations)o.relations.forEach(r=>addNPC("亲属"));
 if(o.flags)o.flags.forEach(f=>{if(!S.flags.includes(f))S.flags.push(f);});
 if(o.rep)for(const k in o.rep)S.reputation[k]=(S.reputation[k]||0)+o.rep[k];
 // 应用词条
 gachaState.traits.forEach(t=>{
  if(t.stats)for(const k in t.stats){if(k==="soulGain"){}else S[k]=(S[k]||0)+t.stats[k];}
  if(t.flags)t.flags.forEach(f=>{if(!S.flags.includes(f))S.flags.push(f);});
  if(t.items)t.items.forEach(it=>S.items[it]=(S.items[it]||0)+1);
  if(t.special==="companion"){/* 觉醒时给 */}
 });
 S.maxHp=100+Math.floor(S.physique/2);S.hp=S.maxHp;
 saveCodex();save();
 S.screen="main";render();
 toast("人生开始！");
}

    <div>${p.hp}/${p.maxHp}HP</div>

   <div style="font-size:12px;color:var(--muted);margin:4px 0">性格：${p.nature} · 亲密：${p.intimacy} · 特性：${p.trait||'-'}</div>
   <div style="font-size:12px">攻${p.stats.atk} 防${p.stats.def} 速${p.stats.spd} 魂${p.stats.soul}</div>
   <div style="font-size:12px;color:var(--gold2)">魂环：${p.rings.join(' ')||'无'}</div>
   <div class="row" style="margin-top:6px">
    <button class="btn small ${S.activePartner===i?'primary':''}" onclick="S.activePartner=${i};save();render()">出战</button>
    <button class="btn small" onclick="showPartnerSkills(${i})">技能</button>
   </div>
  </div>`;
 });
 if(!S.partners.length)html+='<p style="color:var(--muted)">暂无伙伴，通过探索、事件或战斗收服</p>';
 html+='</div>';
 div.innerHTML=html;
}
function showPartnerSkills(i){
 const p=S.partners[i];
 const box=document.createElement("div");box.className="modal";
 box.innerHTML=`<div class="modal-box"><h3 class="title">${p.name}的魂技</h3>
  ${p.skills.map(sn=>{const sk=SKILLS[sn];return`<div class="card"><b>${sn}</b> <span class="tag common">${sk.type}</span><br><span style="font-size:12px;color:var(--muted)">${sk.desc}</span><br><span style="font-size:12px">威力${sk.power} 命中${sk.acc} PP${sk.pp}</span></div>`;}).join('')}
  <button class="btn" style="width:100%" onclick="this.closest('.modal').remove()">关闭</button></div>`;

/* ---- 地图 ---- */
function map(div){
 let html=`<div class="card"><h3 class="title">世界地图</h3><p style="color:var(--muted);font-size:13px">当前位置：${LOCATIONS[S.location].name}</p></div>`;
 for(const id in LOCATIONS){
  const loc=LOCATIONS[id];
  const unlocked=id===S.location||S.flags.includes("unlock_"+id)||["village","town","academy","city","forest_edge"].includes(id);
  html+=`<div class="card" style="${unlocked?'':'opacity:0.5'}">
   <div class="row" style="justify-content:space-between">
    <b>${loc.name}${id===S.location?' 📍':''}</b>
    ${unlocked?`<button class="btn small primary" onclick="S.location='${id}';save();render()">前往</button>`:'<span class="tag common">未解锁</span>'}
   </div>
   <p style="font-size:12px;color:var(--muted);margin-top:4px">${loc.desc}</p>
   <p style="font-size:11px;color:var(--muted)">遭遇：${(loc.enc||[]).map(e=>SPECIES.find(s=>s.id===e)?.name).join('、')||'无'}</p>
  </div>`;
 }

}

/* ---- 轮盘 ---- */
function roulette(div){
 div.innerHTML=`<div class="roulette-wrap">
  <h3 class="title">命运轮盘</h3>
  <p style="color:var(--muted);font-size:13px">${S.rouletteUsed?'本月已转动过':'每月可转动一次，触发随机事件'}</p>
  <div class="pointer"></div>
  <canvas id="rouletteCanvas" width="340" height="340"></canvas>
  <button class="btn primary" id="spinBtn" onclick="doSpin()" ${S.rouletteUsed?'disabled':''}>转动轮盘</button>
  <p style="color:var(--muted);font-size:12px">气运越高，稀有事件概率越大</p>
 </div>`;
 drawRoulette();
}
function drawRoulette(){
 const cv=document.getElementById("rouletteCanvas");if(!cv)return;
 const ctx=cv.getContext("2d");const cx=170,cy=170,r=160;
 const pool=getRouletteEvents();
 const types=[...new Set(pool.map(e=>e.type))];
 const colors=["#d4af37","#c77dff","#6ec1ff","#7ee787","#ff6b6b","#ffb347","#6ec1ff","#c77dff"];
 ctx.clearRect(0,0,340,340);
 const step=Math.PI*2/types.length;
 types.forEach((t,i)=>{
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,i*step,(i+1)*step);ctx.closePath();
  ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle="#000";ctx.lineWidth=2;ctx.stroke();
  ctx.save();ctx.translate(cx,cy);ctx.rotate(i*step+step/2);
  ctx.fillStyle="#000";ctx.font="bold 11px sans-serif";ctx.textAlign="center";
  ctx.fillText(t.slice(0,4),r/2,4);ctx.restore();
 });
 ctx.beginPath();ctx.arc(cx,cy,20,0,Math.PI*2);ctx.fillStyle="#1e1830";ctx.fill();ctx.strokeStyle="#d4af37";ctx.stroke();
}
function doSpin(){
 const cv=document.getElementById("rouletteCanvas");
 cv.style.transition="transform 3s cubic-bezier(.17,.67,.12,.99)";
 cv.style.transform=`rotate(${ri(720,1440)}deg)`;
 document.getElementById("spinBtn").disabled=true;
 setTimeout(()=>{spinRoulette();},3000);
}

/* ---- 战斗 ---- */
function battleScreen(div){
 const b=S.battle;if(!b){S.screen="main";render();return;}
 const player=S.partners[b.playerIdx];
 const enemy=b.enemies[b.enemyIdx];
 div.innerHTML=`
  <div class="battle-field">
   <div class="combatant" id="playerSide">
    <div class="sprite">🐉</div>
    <div><b>${player?.name||'-'}</b> Lv.${player?.level}</div>
    <div class="hpbar"><div style="width:${player?(player.hp/player.maxHp*100):0}%"></div></div>
    <div style="font-size:11px">${player?.hp||0}/${player?.maxHp||0}</div>
   </div>
   <div style="font-size:24px;color:var(--gold)">⚔️</div>
   <div class="combatant" id="enemySide">
    <div class="sprite">👹</div>
    <div><b>${enemy?.name||'-'}</b> Lv.${enemy?.level}</div>
    <div class="hpbar"><div style="width:${enemy?(enemy.hp/enemy.maxHp*100):0}%"></div></div>
    <div style="font-size:11px">${enemy?.hp||0}/${enemy?.maxHp||0}${enemy?.status?' ['+enemy.status+']':''}</div>
   </div>
  </div>
  <div class="log" id="battleLog">${b.log.slice(-6).map(l=>`<div>${l}</div>`).join('')}</div>
  <div class="grid grid-2">
   ${(player?.skills||["普通攻击"]).map(s=>`<button class="btn" onclick="battleAction('${s}')">${s}</button>`).join('')}
  </div>
  <div class="row" style="margin-top:8px">
   <button class="btn small" onclick="battleCatch()" ${b.wild?'':'disabled'}>收服</button>
   <button class="btn small" onclick="showSwitch()">更换</button>
   <button class="btn small danger" onclick="battleFlee()">逃跑</button>
  </div>
  <div style="font-size:11px;color:var(--muted);margin-top:6px">敌人剩余：${b.enemies.length-b.enemyIdx}</div>`;
 const log=document.getElementById("battleLog");if(log)log.scrollTop=log.scrollHeight;
}
function showSwitch(){
 const box=document.createElement("div");box.className="modal";
 box.innerHTML=`<div class="modal-box"><h3 class="title">更换伙伴</h3>
  ${S.partners.map((p,i)=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center">
   <span>${p.name} Lv.${p.level} ${p.hp}/${p.maxHp}HP</span>
   <button class="btn small ${p.hp<=0?'':'primary'}" ${p.hp<=0?'disabled':''} onclick="this.closest('.modal').remove();battleSwitch(${i})">换上</button>
  </div>`).join('')}
  <button class="btn" style="width:100%" onclick="this.closest('.modal').remove()">取消</button></div>`;
 document.getElementById("modalRoot").appendChild(box);
}

/* ---- NPC ---- */
function npc(div){
 let html=`<div class="card"><h3 class="title">人际关系</h3>`;
 if(!S.npcs.length)html+='<p style="color:var(--muted)">还不认识什么人</p>';
 S.npcs.forEach((n,i)=>{
  html+=`<div class="card" style="background:var(--panel2)">
   <div class="row" style="justify-content:space-between">
    <b>${n.name}</b><span class="tag ${n.type==='恋人'||n.type==='spouse'?'legend':'common'}">${n.type}</span>
   </div>
   <div style="font-size:12px;color:var(--muted)">好感度：${n.affinity} · 年龄：${n.age}</div>
   <div class="bar"><div style="width:${clamp(n.affinity,0,100)}%;background:linear-gradient(90deg,#ff6b9d,#c77dff)"></div></div>
   <div class="row" style="margin-top:6px">
    <button class="btn small" onclick="npcInteract(${i},'talk')">交谈</button>
    <button class="btn small" onclick="npcInteract(${i},'gift')">送礼(-30金)</button>
    ${n.affinity>=80&&n.type!=='spouse'?`<button class="btn small primary" onclick="npcInteract(${i},'marry')">求婚</button>`:''}
   </div>
  </div>`;
 });
 html+='</div>';div.innerHTML=html;
}
function npcInteract(i,type){
 const n=S.npcs[i];
 if(type==="talk"){n.affinity+=ri(2,8);S.mood+=5;logEvent("你与"+n.name+"交谈甚欢。");}
 else if(type==="gift"){if(S.wealth>=30){S.wealth-=30;n.affinity+=ri(5,15);logEvent("你送了礼物给"+n.name+"。");}else toast("金魂币不足");}
 else if(type==="marry"){n.type="spouse";S.flags.push("married");const child={name:"孩子"+(S.children.length+1),age:0,inherited:false};S.children.push(child);logEvent("你与"+n.name+"结婚了！");toast("新婚快乐！");}
 save();render();
}

}

function codex(div){

/* ---- 设置 ---- */
function settings(div){
 div.innerHTML=`<div class="card"><h3 class="title">设置与存档</h3>
  <div class="col" style="gap:10px">
   <button class="btn primary" onclick="save();toast('已保存')">💾 保存游戏</button>
   <button class="btn" onclick="exportSave()">📤 导出存档</button>
   <button class="btn" onclick="importSave()">📥 导入存档</button>
   <button class="btn danger" onclick="if(confirm('确定删除存档？')){localStorage.removeItem('douluo_save');S.screen='title';render();}">🗑️ 删除存档</button>
   <button class="btn danger" onclick="if(confirm('确定清空图鉴？')){localStorage.removeItem('douluo_codex');S.codex=loadCodex();render();}">🗑️ 清空图鉴</button>
  </div>
  <p style="color:var(--muted);font-size:12px;margin-top:16px">游戏版本 v1.0 · 斗罗：武魂人生</p>
 </div>`;
}
function exportSave(){
 const str=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
 const box=document.createElement("div");box.className="modal";
 box.innerHTML=`<div class="modal-box"><h3 class="title">导出存档</h3>
  <textarea style="width:100%;height:120px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:11px" readonly>${str}</textarea>
  <button class="btn" style="width:100%;margin-top:8px" onclick="this.closest('.modal').remove()">关闭</button></div>`;
 document.getElementById("modalRoot").appendChild(box);
}
function importSave(){
 const box=document.createElement("div");box.className="modal";
 box.innerHTML=`<div class="modal-box"><h3 class="title">导入存档</h3>
  <textarea id="importText" placeholder="粘贴存档字符串" style="width:100%;height:120px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:11px"></textarea>
  <button class="btn primary" style="width:100%;margin-top:8px" onclick="try{const t=document.getElementById('importText').value;S=JSON.parse(decodeURIComponent(escape(atob(t))));save();this.closest('.modal').remove();render();}catch(e){toast('存档无效');}">导入</button>
  <button class="btn" style="width:100%;margin-top:4px" onclick="this.closest('.modal').remove()">取消</button></div>`;
 document.getElementById("modalRoot").appendChild(box);
}

/* ============ 初始化 ============ */
S=newState((Date.now()&0xffffffff));
S.codex=loadCodex();
S.screen="title";
render();
</script>
